# Publishes one plugin from this repo to its own release repo.
#
# Trigger: push a tag named <plugin-id>@<version>, for example literature-matrix@1.0.1.
# The workflow checks the tag against plugins/<plugin-id>/manifest.json and copies that
# folder into HackrLife/<plugin-id>. The release repo's own Release workflow then builds the
# plugin and creates the GitHub release. Obsidian reviews each new release automatically.
#
# One-time setup: add a repository secret PUBLISH_TOKEN, a fine-grained GitHub token with
# Contents: read and write on the HackrLife/<plugin-id> release repos.

name: Publish plugin

on:
  push:
    tags:
      - "*@*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Read plugin id and version from the tag
        id: tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "id=${TAG%@*}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#*@}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Check the manifest matches the tag
        working-directory: plugins/${{ steps.tag.outputs.id }}
        run: |
          MANIFEST_ID=$(node -p "require('./manifest.json').id")
          MANIFEST_VERSION=$(node -p "require('./manifest.json').version")
          if [ "$MANIFEST_ID" != "${{ steps.tag.outputs.id }}" ] || [ "$MANIFEST_VERSION" != "${{ steps.tag.outputs.version }}" ]; then
            echo "Tag says ${{ steps.tag.outputs.id }}@${{ steps.tag.outputs.version }} but manifest.json says $MANIFEST_ID@$MANIFEST_VERSION"
            exit 1
          fi

      - name: Sync the plugin folder to its release repo
        env:
          GH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          ID: ${{ steps.tag.outputs.id }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          git clone "https://x-access-token:${GH_TOKEN}@github.com/HackrLife/${ID}.git" release-repo
          rsync -a --delete \
            --exclude ".git" --exclude ".github" --exclude "node_modules" --exclude "build" --exclude "main.js" \
            "plugins/${ID}/" release-repo/
          cd release-repo
          git checkout -B main
          git config user.name "Dev Das"
          git config user.email "dev@hackrlife.com"
          git add -A
          git diff --cached --quiet || git commit -m "Release ${VERSION}"
          git push origin main
